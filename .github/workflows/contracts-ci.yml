name: Contracts CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and Test Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test
      - name: Build WASM
        run: |
          cargo build --target wasm32v1-none --release
          for file in target/wasm32v1-none/release/*.wasm; do
            size=$(stat -c%s "$file")
            echo "$(basename "$file"): $size bytes"
            if [ "$size" -gt 131072 ]; then
              echo "::error::$(basename "$file") exceeds the 128 KiB Soroban contract size limit"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm
          path: target/wasm32v1-none/release/*.wasm
      - name: Install Stellar CLI
        run: |
          cargo install --locked stellar-cli --features opt
          stellar --version
      - name: Generate TypeScript bindings
        run: |
          for contract in property-token yield-distributor; do
            stellar contract bindings typescript \
              --wasm "target/wasm32v1-none/release/${contract}.wasm" \
              --output-dir "bindings/${contract}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: contract-bindings
          path: bindings/

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --lcov --output-path lcov.info --fail-under-lines 85
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info